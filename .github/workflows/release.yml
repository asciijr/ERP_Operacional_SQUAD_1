# CD (parte que não depende da hospedagem): ao criar a tag vX.Y.Z na main,
# publica as imagens de produção no GitHub Container Registry e cria a Release.
# O deploy em servidor fica pendente da decisão DP13 (hospedagem). Ver docs/decisions/0003-ci-cd.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garantir que a tag está na main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tags só na main (Guia 3.5)"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push das imagens
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${GITHUB_REF_NAME}"
          for svc in backend frontend; do
            IMG="ghcr.io/$OWNER/erp-operacional-$svc"
            docker build --target prod -t "$IMG:$TAG" -t "$IMG:latest" "./$svc"
            docker push "$IMG:$TAG"
            docker push "$IMG:latest"
          done

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
